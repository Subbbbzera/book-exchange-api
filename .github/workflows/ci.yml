name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: book_exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d book_exchange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/book_exchange_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/book_exchange_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-key-at-least-16-chars
      JWT_EXPIRES_IN: 1d
      ADMIN_EMAIL: admin@bookexchange.local
      ADMIN_PASSWORD: CiAdminPassword123!
      ADMIN_NAME: System Admin
      ADMIN_PHONE: '+380500000000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
